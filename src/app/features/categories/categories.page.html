<app-page-header title="Категории">
  <button type="button" class="icon-btn" aria-label="Создать категорию" (click)="create()">
    <app-icon name="plus" />
  </button>
</app-page-header>

@switch (status()) {
  @case ('loading') {
    <div class="content" aria-busy="true">
      <div class="panel">
        @for (row of [1, 2, 3, 4, 5, 6]; track row) {
          <div class="panel__row">
            <span class="skeleton category__skeleton"></span>
          </div>
        }
      </div>
    </div>
  }

  @case ('error') {
    <app-empty-state
      icon="alert-circle"
      title="Не удалось загрузить категории"
      hint="Проверьте связь и попробуйте ещё раз."
    >
      <button type="button" class="btn btn--primary" (click)="load()">Повторить</button>
    </app-empty-state>
  }

  @default {
    @if (isEmpty()) {
      <app-empty-state
        icon="tag"
        title="Категорий пока нет"
        hint="Категории помогают увидеть в аналитике, на что уходят деньги."
      >
        <button type="button" class="btn btn--primary" (click)="create()">
          Создать категорию
        </button>
      </app-empty-state>
    } @else {
      <div class="content">
        <div class="panel">
          @for (category of categories(); track category.id) {
            <button type="button" class="panel__row category" (click)="edit(category)">
              <app-icon class="category__icon" name="tag" />
              <span class="category__main">
                <span class="category__title truncate">{{ category.title }}</span>
                @if (category.parents.length > 0) {
                  <!-- Родительские категории задают дерево аналитики: без подписи
                       непонятно, почему трата попала в чужую ветку отчёта. -->
                  <span class="category__parents truncate">
                    в составе: {{ parentTitles(category) }}
                  </span>
                }
              </span>
              <app-icon class="category__chevron" name="chevron-right" />
            </button>
          }
        </div>

        <button type="button" class="btn btn--secondary btn--block" (click)="create()">
          <app-icon name="plus" />
          Создать категорию
        </button>
      </div>
    }
  }
}
