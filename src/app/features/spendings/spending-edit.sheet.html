<div class="sheet" appSwipeToClose (dismissed)="close()">
  <div class="sheet__grabber" aria-hidden="true"></div>

  <div class="sheet__header">
    <h2 class="sheet__title">Трата</h2>
    <button
      type="button"
      class="icon-btn icon-btn--danger"
      aria-label="Удалить трату"
      [disabled]="isSaving()"
      (click)="remove()"
    >
      <app-icon name="trash" />
    </button>
    <button
      type="button"
      class="icon-btn"
      aria-label="Закрыть"
      [disabled]="isBusy()"
      (click)="close()"
    >
      <app-icon name="close" />
    </button>
  </div>

  <div class="sheet__body">
    <div class="field" [class.field--invalid]="descriptionError()">
      <label class="field__label" for="spending-description">Описание</label>
      <input
        id="spending-description"
        class="field__control"
        type="text"
        autocomplete="off"
        [value]="description()"
        (input)="onDescription($event)"
      />
      @if (descriptionError(); as error) {
        <p class="field__error">{{ error }}</p>
      }
    </div>

    <div class="amount-row">
      <div class="field amount-row__amount" [class.field--invalid]="amountError()">
        <label class="field__label" for="spending-amount">Сумма</label>
        <!-- inputmode="decimal" открывает на телефоне числовую клавиатуру:
             прежнее поле было обычным текстовым и вызывало буквенную. -->
        <input
          id="spending-amount"
          class="field__control field__control--amount"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          [value]="amountText()"
          (input)="onAmount($event)"
        />
      </div>

      <div class="field amount-row__currency">
        <span class="field__label" id="spending-currency-label">Валюта</span>
        <button
          type="button"
          class="field__control currency-button"
          aria-labelledby="spending-currency-label"
          (click)="pickCurrency()"
        >
          <span>{{ currencyCode() }}</span>
          <app-icon name="chevron-down" />
        </button>
      </div>
    </div>

    @if (amountError(); as error) {
      <p class="field__error amount-row__error">{{ error }}</p>
    }

    <div class="field" [class.field--invalid]="dateError()">
      <label class="field__label" for="spending-date">Дата</label>
      <app-date-input
        inputId="spending-date"
        label="Дата"
        [value]="dateText()"
        [invalid]="dateError() !== null"
        [describedBy]="dateError() ? 'spending-date-error' : null"
        (valueChange)="onDate($event)"
      />
      @if (dateError(); as error) {
        <p id="spending-date-error" class="field__error">{{ error }}</p>
      }
    </div>

    <section class="markup">
      <div class="field-head">
        <h3 class="field__label">Категория</h3>

        <!-- Справка под рукой в момент выбора: решение принимается здесь, а не
             на экране настроек, куда за ней пришлось бы уходить из формы. -->
        <button
          type="button"
          class="field-head__help"
          aria-label="Как выбрать категорию"
          (click)="openGuide('basics')"
        >
          <app-icon name="info" />
        </button>
      </div>

      <button
        type="button"
        class="panel panel--bordered category-row"
        [class.category-row--guess]="categorySource() === 'Model'"
        [disabled]="isBusy()"
        (click)="pickCategory()"
      >
        <app-icon class="category-row__icon" name="folder" />
        <span class="category-row__title truncate" [class.category-row__title--empty]="!hasCategory()">
          {{ categoryLabel() }}
        </span>
        <app-markup-source-mark [source]="categorySource()" />
        <app-icon class="category-row__chevron" name="chevron-right" />
      </button>

      @if (canReject()) {
        <!-- Отказ - массовая операция и живёт отдельно от выбора категории:
             сменить категорию можно строкой выше, и это действие локальное. -->
        <button
          type="button"
          class="btn btn--secondary btn--block reject"
          [disabled]="isBusy()"
          (click)="reject()"
        >
          Отвергнуть разметку
        </button>
      }
    </section>

    <section class="markup">
      <div class="field-head">
        <h3 class="field__label">Теги</h3>

        <button
          type="button"
          class="field-head__help"
          aria-label="Как выбрать теги"
          (click)="openGuide('tags')"
        >
          <app-icon name="info" />
        </button>
      </div>

      <div class="chips">
        @for (tag of tags.list(); track tagKey(tag)) {
          <span class="chip chips__chip">
            {{ tag.title }}
            <button
              type="button"
              class="chips__remove"
              [attr.aria-label]="'Снять тег ' + tag.title"
              [disabled]="isBusy()"
              (click)="removeTag(tag)"
            >
              <app-icon name="close" />
            </button>
          </span>
        }

        <button
          type="button"
          class="chip chips__add"
          [disabled]="isBusy()"
          (click)="addTag()"
        >
          <app-icon name="plus" />
          Добавить
        </button>
      </div>
    </section>
  </div>

  <div class="sheet__footer">
    <button
      type="button"
      class="btn btn--secondary"
      [disabled]="isBusy()"
      (click)="close()"
    >
      Отмена
    </button>
    <button
      type="button"
      class="btn btn--primary"
      [disabled]="!canSave()"
      (click)="save()"
    >
      {{ isSaving() ? 'Сохраняем…' : 'Сохранить' }}
    </button>
  </div>
</div>
