<h1 mat-dialog-title>Создать категорию</h1>
<div mat-dialog-content class="position-dialog">
  <div>
    <mat-form-field>
      <input placeholder="Название" required matInput [(ngModel)]="category.title">
    </mat-form-field>
  </div>
</div>

<div class="mat-dialog-actions">
  <button mat-button (click)="closeDialog()" mat-flat-button color="warn">
    <span>Отмена</span>
  </button>
  <button mat-button (click)="doAction()" [disabled]="!category.title">OK</button>
</div>
