<mat-card class="content-card" *ngIf="categories.length != 0">
    <mat-card-header class="content-in-center">
        <mat-card-title class="categories-list-header">Мои категории трат</mat-card-title>
    </mat-card-header>
    <mat-card-content>

        <div class="container positions-block content-in-center">
<!--            <div class="flex-h-space-between">-->
<!--                <mat-form-field>-->
<!--                    <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Фильтр">-->
<!--                </mat-form-field>-->
<!--            </div>-->
            <button class="process-check-button" mat-button (click)="createCategory()" mat-flat-button>
                <mat-icon mat-list-icon color="primary" class='process-check-icon'>refresh</mat-icon>
                <span class="process">Создать</span>
            </button>
            <div>

                <table mat-table [dataSource]="dataSource">

                    <ng-container matColumnDef="index">
                        <th mat-header-cell *matHeaderCellDef></th>
                        <td mat-cell *matCellDef="let i = index"> {{i + 1}} </td>
                    </ng-container>

                    <ng-container matColumnDef="title">
                        <th mat-header-cell *matHeaderCellDef></th>
                        <td mat-cell *matCellDef="let category"> {{category.title}} </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef></th>
                        <td mat-cell *matCellDef="let category" class="row-actions-td">
                            <div class="row-action-buttons" (click)="$event.stopPropagation()">
                                <button mat-icon-button (click)="deleteCategory(category.id)" onclick="this.blur()"
                                        matTooltip="Удалить категорию">
                                    <mat-icon class="red">delete</mat-icon>
                                </button>
                            </div>
                        </td>
                    </ng-container>
                </table>
            </div>
        </div>
    </mat-card-content>

</mat-card>

<div class="zero-balance-wrap" *ngIf="categories.length == 0">
    <h1>Список категорий пуст. Самое время добавить первую!</h1>
    <button class="process-check-button" mat-button (click)="createCategory()" mat-flat-button>
        <mat-icon mat-list-icon color="primary" class='process-check-icon'>refresh</mat-icon>
        <span class="process">Создать</span>
    </button>
</div>
