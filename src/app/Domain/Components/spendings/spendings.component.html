<mat-card class="content-card content-in-center" *ngIf="!!spendings && spendings.length != 0">
  <!--  <mat-card-header class="content-in-center">-->
  <mat-card-title class="categories-list-header">Мои траты</mat-card-title>
  <!--  </mat-card-header>-->
  <mat-card-content>

    <table mat-table
           [dataSource]="dataSource" multiTemplateDataRows
           class="mat-elevation-z8">

      <ng-container matColumnDef="show-category">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let spending" class="row-actions-td">
          <div (click)="$event.stopPropagation()">
            <button mat-icon-button
                    (click)="toggleExpand(spending)"
                    matTooltip="Раскрыть категории">
              <mat-icon>{{expandedElements.includes(spending.id) ? 'keyboard_arrow_up' : 'keyboard_arrow_down'}}</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Дата</th>
        <td mat-cell *matCellDef="let spending"> {{spending.date | date:'dd.MM.yy (E)'}} </td>
      </ng-container>

      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef>Сумма</th>
        <td mat-cell *matCellDef="let spending"> {{spending.amount}} </td>
      </ng-container>

      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Описание</th>
        <td mat-cell *matCellDef="let spending"> {{spending.description}} </td>
      </ng-container>

      <ng-container matColumnDef="currencyCode">
        <th mat-header-cell *matHeaderCellDef>Валюта</th>
        <td mat-cell *matCellDef="let spending">
          <img [src]=FlagEmojiiConverter.getSrcByEmojiCode(currencyMap.get(spending.currencyId)!.flagEmojiCode)>
          {{currencyMap.get(spending.currencyId)!.code}} </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let spending" class="row-actions-td">
          <div class="row-action-buttons" (click)="$event.stopPropagation()">
            <button mat-icon-button (click)="deleteSpending(spending.id)" onclick="this.blur()"
                    matTooltip="Удалить трату">
              <mat-icon class="red">delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="expandedDetail">
        <td mat-cell *matCellDef="let spending" [attr.colspan]="displayedColumns.length">
          <div
               [@detailExpand]="expandedElements.includes(spending.id) ? 'expanded' : 'collapsed'">
            <app-categories-tree
              [treeCategories]=spending.categories
              [categoriesForSelect]=categoriesForSelect
              [spendingId]="spending.id"
              [expandingStates]="spendingsCategoriesExpandingStates[spending.id]"
              (categoriesUpdated)="onCategoriesUpdated({ response : $event })"></app-categories-tree>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let spending; columns: displayedColumns;"
          [class.example-expanded-row]="expandedElements.includes(spending.id)"
          (click)="openSpendingCard(spending)"
          class="spending-row">
      </tr>
      <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="example-detail-row"></tr>
    </table>

  </mat-card-content>

</mat-card>

<div class="zero-balance-wrap" *ngIf="!!spendings && spendings.length == 0">
  <h1>Список трат пока пуст</h1>
</div>
