<div class="spendings-search-results"
     infiniteScroll
     [infiniteScrollDistance]="2"
     [infiniteScrollThrottle]="500"
     (scrolled)="onScroll()"
     [scrollWindow]="false">

    <mat-card
      class="content-card content-in-center"
      appearance="outlined">
      <mat-accordion class="filtration-block">
        <mat-expansion-panel
          (opened)="filtrationPanelIsOpen"
          (closed)="!filtrationPanelIsOpen">

          <mat-expansion-panel-header>
            <mat-panel-description class="flex-h-center">
              Фильтрация
            </mat-panel-description>
          </mat-expansion-panel-header>

          <div class="flex-h-center flex-v-center">
            <div #myTable>
              <mat-form-field class="search-spending-input" appearance="outline">
                <input matInput [(ngModel)]="searchString" placeholder="Описание траты">
                <button *ngIf="!!searchString" matSuffix mat-icon-button aria-label="Clear" (click)="searchString=''">
                  <mat-icon>close</mat-icon>
                </button>
              </mat-form-field>
              <button
                mat-raised-button
                (click)="applyFiltration()"
                style="margin: 0 0 0 5px"> Поиск
              </button>
            </div>
          </div>

          <div class="flex-h-center">
            <section class="example-section" [ngStyle]="{'width.px': myTable.offsetWidth, 'margin-left': '-21px' }">
              <mat-checkbox
                color="primary"
                onclick="this.blur()"
                [(ngModel)]="onlyWithoutCategories"
                (click)="applyFiltration()">Без категорий
              </mat-checkbox>
            </section>
          </div>

        </mat-expansion-panel>
      </mat-accordion>
      <mat-card-content *ngIf="!!spendings && spendings.length != 0">

        <table mat-table matTableFilter
               [dataSource]="dataSource" multiTemplateDataRows
               class="mat-elevation-z8 vw-100">

          <ng-container matColumnDef="show-category">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let spending" class="row-actions-td">
              <div (click)="$event.stopPropagation()">
                <button mat-icon-button
                        class="toogle-row"
                        (click)="toggleExpand(spending)"
                        matTooltip="Раскрыть категории">
                  <mat-icon>{{expandedElements.includes(spending.id) ? 'keyboard_arrow_up' : 'keyboard_arrow_down'}}</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef>Дата</th>
            <td mat-cell *matCellDef="let spending"> {{spending.date | date:'dd.MM.yy (E)' }} </td>
          </ng-container>

          <ng-container matColumnDef="amount">
            <th mat-header-cell *matHeaderCellDef>Сумма</th>
            <td mat-cell *matCellDef="let spending"> {{spending.amount}} </td>
          </ng-container>

          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef>Описание</th>
            <td mat-cell *matCellDef="let spending"> {{spending.description}} </td>
          </ng-container>

          <ng-container matColumnDef="currencyCode">
            <th mat-header-cell *matHeaderCellDef>Валюта</th>
            <td mat-cell *matCellDef="let spending">
              <img [src]=FlagEmojiiConverter.getSrcByEmojiCode(currencyMap.get(spending.currencyId)!.flagEmojiCode)>
              {{currencyMap.get(spending.currencyId)!.code}} </td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let spending" class="row-actions-td">
              <div class="row-action-buttons" (click)="$event.stopPropagation()">
                <button mat-icon-button (click)="deleteSpending(spending.id)" onclick="this.blur()"
                        matTooltip="Удалить трату">
                  <mat-icon class="red">delete</mat-icon>
                </button>
              </div>
            </td>
          </ng-container>

          <ng-container matColumnDef="expandedDetail">
            <td mat-cell *matCellDef="let spending" [attr.colspan]="displayedColumns.length">
              <div
                [@detailExpand]="expandedElements.includes(spending.id) ? 'expanded' : 'collapsed'">
                <app-spending-categories-tree
                  [treeCategories]=spending.categories
                  [categoriesForSelect]=categoriesForSelect
                  [spendingId]="spending.id"
                  [expandingStates]="spendingsCategoriesExpandingStates[spending.id]"
                  (categoriesUpdated)="onCategoriesUpdated({ response : $event })"></app-spending-categories-tree>
              </div>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let spending; columns: displayedColumns;"
              [class.example-expanded-row]="expandedElements.includes(spending.id)"
              (click)="openSpendingCard(spending)"
              class="spending-row">
          </tr>
          <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="example-detail-row"></tr>
        </table>

        <div *ngIf="isLoading" class="content-in-center">Loading...</div>

        <div [ngClass]="showLoadMoreButton() ? 'content-in-center' : 'display-none'"
             style="margin-top: 5px">
          <button mat-button (click)="loadMoreSpendings()">More</button>
        </div>

      </mat-card-content>
    </mat-card>

    <!--    &lt;!&ndash;        </ngx-spinner>&ndash;&gt;-->

    <!--  </div>-->


  <div class="content-in-center" *ngIf="!onlyWithoutCategories && !!spendings && spendings.length == 0">
  <span style="text-align: center">
    <h1>Список трат пуст</h1>
  </span>
  </div>

  <div class="content-in-center" *ngIf="onlyWithoutCategories && !!spendings && spendings.length == 0">
  <span style="text-align: center">
    <h1>Трат без категорий нет</h1>
  </span>
  </div>
</div>
