server {
    # default_server, чтобы этот блок не зависел от того, какие ещё файлы лежат
    # в conf.d: без него сервером по умолчанию становится первый подходящий
    # listen в порядке подключения файлов, то есть дефолтный default.conf
    # образа - он перехватывал бы все запросы вместе с нашими заголовками.
    listen 80 default_server;

    root /usr/share/nginx/html;

    # index.html собирается без хеша в имени и жёстко ссылается на бандлы
    # конкретной сборки, поэтому устаревшая копия тянет за собой уже удалённые
    # файлы. Telegram WebView кеширует агрессивнее обычного браузера: без явных
    # заголовков он применяет эвристику и переиспользует прошлый ответ, из-за
    # чего мини-апп открывался старым и ломался, пока не нажмёшь reload.
    # Выбран no-store, а не no-cache: no-cache разрешает хранить ответ и
    # рассчитывает на ревалидацию, а no-store запрещает хранить его вовсе, и
    # результат перестаёт зависеть от того, как именно WebView обходится с
    # ревалидацией. Pragma и Expires добавлены для кеширующих прослоек, не
    # понимающих Cache-Control.
    location = /index.html {
        # always здесь осознанно: запрет кеширования нужен на любом ответе,
        # включая ошибку, - закешированный сбой index.html ломает вход в апп.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Ассеты копируются как есть, без хеша в имени, поэтому immutable им нельзя:
    # заменённый файл иначе никогда бы не доехал до клиента. Префикс именно
    # ^~: обычный проигрывает regex-локации ниже, и ассет с хеш-подобным именем
    # получил бы годовой immutable вопреки этому правилу.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Имя бандла содержит хеш содержимого, новая сборка приходит по новому URL -
    # старый ответ из кеша не может оказаться неактуальным. Регистрозависимо:
    # Angular пишет хеш заглавными, так шаблон реже цепляет обычные файлы.
    location ~ "-[A-Z0-9]{8}\.(?:js|mjs|css|woff2?|png|jpe?g|svg|webp)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Статика, которой нет на диске, должна отвечать 404, а не 200 с телом
    # index.html: иначе /favicon.ico и /robots.txt приходят как HTML, и клиент
    # считает их валидным файлом. Список расширений закрытый, а не общий шаблон
    # "точка и что угодно": сегмент маршрута с точкой (скажем, id вида 12.5)
    # обязан по-прежнему доходить до SPA.
    location ~ "\.(?:css|js|mjs|map|json|txt|xml|ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|otf|eot|webmanifest|html|wasm)$" {
        try_files $uri =404;
    }

    # Маршруты SPA отдаём через index.html. Fallback именно на URI, а не на =404,
    # поэтому запрос уходит внутренним редиректом в location = /index.html и
    # получает его заголовки.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
